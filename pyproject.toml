[project]
name = "showdown-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "playwright>=1.45,<2",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "rapidfuzz>=3,<4",
]

[project.scripts]
showdown-agent = "src.agent.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
